<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-200">

  <!-- container -->
  <main class="max-w-2xl mx-auto p-8 rounded-lg bg-white shadow-md mt-10">
    <h1 class="text-2xl text-center text-gray-600 font-bold mb-4">Taskify App</h1>
    <form id="form" class="mb-4" action="">
      <!-- task field input -->
      <input id="task-input" type="text" placeholder="Enter your task" class="border border-gray-300 rounded-md p-2 w-full mb-4" />

      <!-- action: add -->
      <button type="submit" class="bg-blue-500 text-white rounded-md p-2 w-full">Add Task</button>
    </form>

    <!-- task list -->
    <ul id="task-list" class="mt-4">
      
    </ul>
  </main>

  <script type="module" src="/src/taskify.js"></script>

</body>
</html>
